name: Version and Hygiene

# Fast checks that enforce the convention ported in v1.5.4: one job per check.
#
# Each job's `name:` is the check name GitHub shows and the name a
# branch-protection rule refers to. Renaming a job breaks any rule that
# names it, and a new job is not required by anything until it is added
# to the rule by hand.
#
# These live in their own workflow, not in validate.yml, so they can
# run in parallel with the slower test matrix and finish in under a
# minute. A stale version site or a broken wrapper copy fails here
# before the heavier wrapper matrix even starts.
#
# Runs on:
#   - every push to main
#   - every tag push (so a release tag is validated by the same rules)
#   - every pull request

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  check-version:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install CI requirements
        run: python3 -m pip install -r requirements-ci.txt
      - name: Check version consistency
        run: python3 tools/check_version_consistency.py

  check-mojibake:
    name: Mojibake scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Scan for mojibake
        run: python3 tools/check_mojibake.py

  sync-wrappers-check:
    name: Wrapper copies in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify wrapper copies
        run: python3 tools/sync_wrappers.py --check

  check-country-codes:
    name: Country codes resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify country codes
        run: python3 tools/check_country_codes.py

  check-readme-drift:
    name: README drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check README against the tree
        run: python3 tools/check_readme_drift.py

  check-verification-doc:
    name: Verification docs complete
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check verification docs for placeholders
        run: python3 tools/check_verification_doc.py

  check-registry-freshness:
    name: Registry freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check registry freshness
        run: python3 tools/check_registry_freshness.py

  check-snapshot-freshness:
    name: Snapshot freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check snapshot freshness
        run: python3 tools/check_snapshot_freshness.py

  check-countries-parquet:
    name: Countries Parquet in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install CI requirements
        run: python3 -m pip install -r requirements-ci.txt
      - name: Check countries Parquet is in sync
        run: python3 tools/export_countries_parquet.py --check

  check-aggregated-export:
    name: Aggregated exports in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install CI requirements
        run: python3 -m pip install -r requirements-ci.txt
      - name: Check aggregated Parquet files are in sync
        run: python3 tools/export_aggregated.py --check

  check-vendored-snapshot:
    name: ISO 3166 snapshot matches its source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify the vendored snapshot against its ISO 3166 tag
        run: python3 tools/vendor_iso3166.py --check

  check-enrichment-classification:
    name: "Enrichment: classification up to date"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check classification
        run: python3 tools/enrich_field.py --field classification --check

  check-enrichment-code-lifetime:
    name: "Enrichment: code_lifetime up to date"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check code_lifetime
        run: python3 tools/enrich_field.py --field code_lifetime --check

  check-enrichment-numeric-reused:
    name: "Enrichment: numeric_reused up to date"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check numeric_reused
        run: python3 tools/enrich_field.py --field numeric_reused --check

  check-enrichment-source-url:
    name: "Enrichment: source_url up to date"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check source_url
        run: python3 tools/enrich_field.py --field source_url --check
