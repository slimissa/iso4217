name: Monitor ISO Amendments

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  check-amendments:
    name: Check for new ISO 4217 amendments
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check for amendments
        id: amendment_check
        run: |
          python3 tools/check_amendments.py --json > /tmp/amendment_result.json
          cat /tmp/amendment_result.json
        continue-on-error: true

      - name: Create issue if new amendment detected
        if: steps.amendment_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(fs.readFileSync('/tmp/amendment_result.json', 'utf8').trim());
            const current = result.current_amendment;
            const latest = result.latest_amendment;
            const source = result.source;
            const checkedDate = result.date_checked;
            const response = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'data'
            });
            const issueTitle = 'ISO 4217 amendment ' + latest + ' detected';
            const exists = response.data.some(function(i) { return i.title === issueTitle; });
            if (exists) {
              console.log('Already exists, skipping');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              labels: ['data', 'maintenance'],
              body: 'New ISO 4217 amendment ' + latest + ' detected. Registry has ' + current + '. Review at https://www.currency-iso.org/en/home/amendments.html'
            });

      - name: Log result summary
        run: |
          cat /tmp/amendment_result.json | python3 -m json.tool