name: Validate Registry

# --- What triggers this workflow, and why ------------------------------
#
# Every push to main and every pull request runs every job. There is no path
# filter. A path allow-list fails silent: a file that is not on it
# (examples/**, tools/export_aggregated.py, CHANGELOG.md, ...) triggers
# nothing, even though a test in tests/ guards it, and the gap stays
# invisible until the release gate catches it (v1.7.11 audit, F4).
# Running everything costs CI minutes on doc-only pushes; that is the price
# of a trigger that cannot go stale.
#
# If the cost ever matters, use `paths-ignore` (fail-open: a new file runs
# CI by default), never `paths`.

permissions:
  contents: read

concurrency:
  group: validate-registry-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # --- Job 1: Wrapper copy synchronization -------------------------------
  # Regenerates wrappers/go/iso4217.json and wrappers/rust/iso4217.json
  # from root iso4217.json and fails if the committed copies don't match.
  check-wrapper-sync:
    name: Check wrapper copies are in sync with root
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run sync_wrappers.py
        run: python3 tools/sync_wrappers.py

      - name: Fail if wrapper copies differ from root
        run: |
          git diff --exit-code -- wrappers/go/iso4217.json wrappers/rust/iso4217.json || {
            echo "::error::wrappers/go/iso4217.json and/or wrappers/rust/iso4217.json are out of sync with root iso4217.json."
            echo "::error::Run 'python3 tools/sync_wrappers.py' and commit the result."
            exit 1
          }

  # --- Job 2: SQL export drift check ------------------------------------
  # Regenerates the four SQL files in memory and compares against the
  # committed copies. Runs first so a stale SQL artifact fails fast,
  # before the slower wrapper matrix starts.
  check-sql-export:
    name: Check SQL exports match registry
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check SQL files are in sync
        run: |
          python3 tools/export_sql.py --check || {
            code=$?
            if [ "$code" = "1" ]; then
              echo "::error::SQL files are stale. Run 'python3 tools/export_sql.py' and commit the result."
            elif [ "$code" = "3" ]; then
              echo "::error::One or more SQL files are missing. Run 'python3 tools/export_sql.py' and commit the result."
            else
              echo "::error::export_sql.py --check failed with exit code $code"
            fi
            exit 1
          }

  # --- Job 2b: CSV export drift check -----------------------------------
  # Regenerates the four CSV/TSV files in memory and compares against the
  # committed copies. Runs in parallel with check-sql-export. Both gate
  # validate-json and validate-wrappers, so a stale flat-file artifact
  # fails fast before the slower wrapper matrix starts.
  check-csv-export:
    name: Check CSV exports match registry
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check CSV files are in sync
        run: |
          python3 tools/export_csv.py --check || {
            code=$?
            if [ "$code" = "1" ]; then
              echo "::error::CSV/TSV files are stale. Run 'python3 tools/export_csv.py' and commit the result."
            elif [ "$code" = "3" ]; then
              echo "::error::One or more CSV/TSV files are missing. Run 'python3 tools/export_csv.py' and commit the result."
            else
              echo "::error::export_csv.py --check failed with exit code $code"
            fi
            exit 1
          }

  # --- Job 2c: CLI tests -------------------------------------------------
  # Installs the Python wrapper editable, runs the CLI test suite, then
  # runs three smoke tests through the installed console_scripts entry
  # point to confirm the packaging and the argv rewrites both work end
  # to end. Runs in parallel with check-sql-export and check-csv-export.
  check-cli:
    name: Check CLI tests and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install wrapper editable
        run: pip install -e "wrappers/python[dev]" --quiet

      - name: Run CLI test suite
        run: python3 -m pytest wrappers/python/tests/test_cli.py -v

      - name: Smoke test — JSON output round-trips
        run: |
          iso4217 lookup USD --json | python3 -c "import sys, json; d = json.load(sys.stdin); assert d['code'] == 'USD', d"

      - name: Smoke test — validate exits 1 on an unknown code
        run: |
          set +e
          iso4217 validate USD XYZ
          code=$?
          set -e
          if [ "$code" != "1" ]; then
            echo "::error::expected exit 1 from 'iso4217 validate USD XYZ', got $code"
            exit 1
          fi

      - name: Smoke test — --raw list prints one code per line
        run: |
          count=$(iso4217 list --pegged-to USD --raw code | wc -l)
          if [ "$count" -lt 5 ]; then
            echo "::error::expected at least 5 USD-pegged currencies, got $count"
            exit 1
          fi

  # --- Job 2d: Parquet export drift check --------------------------------
  # Regenerates the Parquet export in memory and compares it logically
  # against the committed file. Runs in parallel with check-sql-export
  # and check-csv-export. All four export gates must pass before
  # validate-json and validate-wrappers start.
  check-parquet-export:
    name: Check Parquet export matches registry
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install CI requirements
        run: pip install -r requirements-ci.txt --quiet

      - name: Check Parquet file is in sync
        run: |
          python3 tools/export_parquet.py --check || {
            code=$?
            if [ "$code" = "1" ]; then
              echo "::error::iso4217.parquet is stale. Run 'python3 tools/export_parquet.py' and commit the result."
            elif [ "$code" = "3" ]; then
              echo "::error::iso4217.parquet is missing. Run 'python3 tools/export_parquet.py' and commit the result."
            else
              echo "::error::export_parquet.py --check failed with exit code $code"
            fi
            exit 1
          }

  # --- Job 3: Schema/data validation ------------------------------------
  # Runs schema/business-logic validation against iso4217.json and the
  # full pytest suite.
  validate-json:
    name: Validate iso4217.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check-sql-export, check-csv-export, check-parquet-export, check-cli]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install CI requirements
        run: pip install -r requirements-ci.txt --quiet

      - name: Validate registry
        run: python3 tools/validate.py

      # --fail-on-skip: a skipped test verified nothing (RELEASE_PATTERN.md, hygiene rule 7).
      - name: Run tests
        run: python3 -m pytest tests/ -v --fail-on-skip

  # --- Job 3: Wrapper tests — matrix across 4 languages ------------------
  # Each language runs in its own parallel job with its own toolchain.
  # A failure in one language doesn't block the others from running,
  # and the UI shows per-language status.
  validate-wrappers:
    name: Validate ${{ matrix.language }} wrapper
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [validate-json, check-wrapper-sync, check-sql-export, check-csv-export, check-parquet-export, check-cli]
  
    strategy:
      fail-fast: false  # Run all languages even if one fails
      matrix:
        include:
          - language: python
            test_cmd: pip install -r requirements-ci.txt && python3 -m pytest tests/test_wrappers.py -v
          - language: javascript
            test_cmd: cd wrappers/javascript && npm test
          - language: go
            test_cmd: cd wrappers/go && go test ./... -v
          - language: rust
            test_cmd: cd wrappers/rust && cargo test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Node.js
        if: matrix.language == 'javascript'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.21'

      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable

      - name: Run ${{ matrix.language }} wrapper tests
        run: ${{ matrix.test_cmd }}