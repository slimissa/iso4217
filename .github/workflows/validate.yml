name: Validate Registry

on:
  push:
    branches: [main]
    paths:
      - 'iso4217.json'
      - 'schema.json'
      - 'tools/validate.py'
      - 'tools/sync_wrappers.py'
      - 'wrappers/go/iso4217.json'
      - 'wrappers/rust/iso4217.json'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'iso4217.json'
      - 'schema.json'
      - 'tools/validate.py'
      - 'tools/sync_wrappers.py'
      - 'wrappers/go/iso4217.json'
      - 'wrappers/rust/iso4217.json'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  check-wrapper-sync:
    name: Check wrapper copies are in sync with root
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sync_wrappers.py
        run: python3 tools/sync_wrappers.py

      - name: Fail if wrapper copies differ from root
        run: |
          git diff --exit-code -- wrappers/go/iso4217.json wrappers/rust/iso4217.json || {
            echo "::error::wrappers/go/iso4217.json and/or wrappers/rust/iso4217.json are out of sync with root iso4217.json."
            echo "::error::Run 'python3 tools/sync_wrappers.py' and commit the result."
            exit 1
          }

  validate-json:
    name: Validate iso4217.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jsonschema pytest

      - name: Validate registry
        run: python3 tools/validate.py

      - name: Run tests
        run: python3 -m pytest tests/ -v

  validate-wrappers:
    name: Validate wrappers
    runs-on: ubuntu-latest
    needs: [validate-json, check-wrapper-sync]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test Python wrapper
        run: |
          pip install pytest
          python3 -m pytest tests/test_wrappers.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test JavaScript wrapper
        run: |
          cd wrappers/javascript
          npm install
          node -e "
            const { CurrencyRegistry } = require('./index.js');
            const registry = new CurrencyRegistry();
            console.log('Loaded', registry.activeCount, 'active currencies');
            const usd = registry.active('USD');
            console.log('USD toMinor(100.50):', usd.toMinor(100.50));
            console.log('JavaScript wrapper OK');
          "

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Test Go wrapper
        run: |
          cd wrappers/go
          go test ./... -v

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test Rust wrapper
        run: |
          cd wrappers/rust
          cargo test