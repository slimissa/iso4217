name: Validate Registry

# --- What triggers this workflow, and why ------------------------------
#
# GitHub Actions only supports path filters at the workflow level, not
# per-job — so every path listed below triggers ALL jobs, not just
# the job whose name matches. The `needs:` chain inside the jobs still
# controls what actually runs and in what order once triggered.
#
# Paths grouped by what they logically belong to:
#   - iso4217.json, schema.json                     -> the registry data itself
#   - tools/validate.py, tools/sync_wrappers.py      -> validation/sync tooling
#   - wrappers/go/iso4217.json, wrappers/rust/iso4217.json
#                                                     -> the two local data copies
#                                                        that can drift from root
#                                                        (see check-wrapper-sync)
#   - wrappers/**/*.py, .js, .go, .rs                -> wrapper SOURCE CODE
#   - wrappers/**/Cargo.toml, go.mod, package.json   -> wrapper dependency manifests
#   - tests/**                                       -> the test suites themselves
#   - .github/workflows/validate.yml                 -> changes to this file
#
# NOTE: wrappers/**/*.json is listed explicitly, not merged into a source
# glob — it's data, not code, and check-wrapper-sync treats it differently.

on:
  push:
    branches: [main]
    paths:
      - 'iso4217.json'
      - 'schema.json'
      - 'tools/validate.py'
      - 'tools/sync_wrappers.py'
      - 'wrappers/go/iso4217.json'
      - 'wrappers/rust/iso4217.json'
      - 'wrappers/**/*.py'
      - 'wrappers/**/*.js'
      - 'wrappers/**/*.go'
      - 'wrappers/**/*.rs'
      - 'wrappers/**/Cargo.toml'
      - 'wrappers/**/go.mod'
      - 'wrappers/**/package.json'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]
    paths:
      - 'iso4217.json'
      - 'schema.json'
      - 'tools/validate.py'
      - 'tools/sync_wrappers.py'
      - 'wrappers/go/iso4217.json'
      - 'wrappers/rust/iso4217.json'
      - 'wrappers/**/*.py'
      - 'wrappers/**/*.js'
      - 'wrappers/**/*.go'
      - 'wrappers/**/*.rs'
      - 'wrappers/**/Cargo.toml'
      - 'wrappers/**/go.mod'
      - 'wrappers/**/package.json'
      - 'tests/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

jobs:
  # --- Job 1: Wrapper copy synchronization -------------------------------
  # Regenerates wrappers/go/iso4217.json and wrappers/rust/iso4217.json
  # from root iso4217.json and fails if the committed copies don't match.
  check-wrapper-sync:
    name: Check wrapper copies are in sync with root
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run sync_wrappers.py
        run: python3 tools/sync_wrappers.py

      - name: Fail if wrapper copies differ from root
        run: |
          git diff --exit-code -- wrappers/go/iso4217.json wrappers/rust/iso4217.json || {
            echo "::error::wrappers/go/iso4217.json and/or wrappers/rust/iso4217.json are out of sync with root iso4217.json."
            echo "::error::Run 'python3 tools/sync_wrappers.py' and commit the result."
            exit 1
          }

  # --- Job 2: Schema/data validation ------------------------------------
  # Runs schema/business-logic validation against iso4217.json and the
  # full pytest suite.
  validate-json:
    name: Validate iso4217.json
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install jsonschema pytest

      - name: Validate registry
        run: python3 tools/validate.py

      - name: Run tests
        run: python3 -m pytest tests/ -v

  # --- Job 3: Wrapper tests — matrix across 4 languages ------------------
  # Each language runs in its own parallel job with its own toolchain.
  # A failure in one language doesn't block the others from running,
  # and the UI shows per-language status.
  validate-wrappers:
    name: Validate ${{ matrix.language }} wrapper
    runs-on: ubuntu-latest
    needs: [validate-json, check-wrapper-sync]
    strategy:
      fail-fast: false  # Run all languages even if one fails
      matrix:
        include:
          - language: python
            test_cmd: pip install pytest && python3 -m pytest tests/test_wrappers.py -v
          - language: javascript
            test_cmd: cd wrappers/javascript && npm install && npm test
          - language: go
            test_cmd: cd wrappers/go && go test ./... -v
          - language: rust
            test_cmd: cd wrappers/rust && cargo test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        if: matrix.language == 'javascript'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Rust
        if: matrix.language == 'rust'
        uses: dtolnay/rust-toolchain@stable

      - name: Run ${{ matrix.language }} wrapper tests
        run: ${{ matrix.test_cmd }}